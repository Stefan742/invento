# Local development database only. Production hosting is decided at M6.
# Port 5433 on the host avoids clashing with a locally installed PostgreSQL on 5432.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invento
      POSTGRES_PASSWORD: invento
      POSTGRES_DB: invento
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invento -d invento']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
